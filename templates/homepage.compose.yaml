networks:
  ${DOCKER_NETWORK_NAME}:
    external: true

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VERSION}
    container_name: homepage
    restart: always
    networks:
      - ${DOCKER_NETWORK_NAME}
    ports:
      - "${HOMEPAGE_PORT}:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
