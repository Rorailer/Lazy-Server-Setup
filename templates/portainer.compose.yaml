networks:
  ${DOCKER_NETWORK_NAME}:
    external: true

services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION}
    container_name: portainer
    restart: always
    networks:
      - ${DOCKER_NETWORK_NAME}
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
