networks:
  ${DOCKER_NETWORK_NAME}:
    external: true

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION}
    container_name: forgejo
    restart: always
    networks:
      - ${DOCKER_NETWORK_NAME}
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGEJO_PORT}:3000"
