networks:
  ${DOCKER_NETWORK_NAME}:
    external: true

services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION}
    container_name: vaultwarden
    restart: always
    networks:
      - ${DOCKER_NETWORK_NAME}
    ports:
      - "${VAULTWARDEN_PORT}:80"
    environment:
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
    volumes:
      - ./data:/data
