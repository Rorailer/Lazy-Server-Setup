networks:
  ${DOCKER_NETWORK_NAME}:
    external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION}
    container_name: cloudflared
    restart: always
    networks:
      - ${DOCKER_NETWORK_NAME}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
