networks:
  ${DOCKER_NETWORK_NAME}:
    external: true

services:
  npm:
    image: jc21/nginx-proxy-manager:${NPM_VERSION}
    container_name: npm
    restart: always
    networks:
      - ${DOCKER_NETWORK_NAME}
    ports:
      - "${NPM_HTTP_PORT}:80"
      - "${NPM_HTTPS_PORT}:443"
      - "${NPM_ADMIN_PORT}:81"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
