networks:
  ${DOCKER_NETWORK_NAME}:
    external: true

services:
  dockge:
    image: louislam/dockge:${DOCKGE_VERSION}
    container_name: dockge
    restart: always
    networks:
      - ${DOCKER_NETWORK_NAME}
    ports:
      - "${DOCKGE_PORT}:5001"
    environment:
      - DOCKGE_STACKS_DIR=${DOCKGE_STACKS_DIR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ${DOCKGE_STACKS_DIR}:${DOCKGE_STACKS_DIR}
